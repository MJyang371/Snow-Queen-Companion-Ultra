# ---------------------------------------------------------------------------
# Gradle / JVM
# ---------------------------------------------------------------------------
# ForgeGradle 6 + Gradle 8.8 needs a decent heap; daemon off keeps builds
# reproducible and avoids stray JVMs locking the build directory.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Fail fast instead of hanging for minutes when a repo stalls.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000

# ---------------------------------------------------------------------------
# Minecraft / Forge (must match the test instance)
#   D:\我的世界测试版\2\versions\1.20.1-Forge_47.4.23
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)

# official mappings -> dev runtime uses Mojang names, same as the Twilight
# Forest jar after fg.deobf(), so TF symbols read normally in the IDE.
mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------------------
# Mod identity
# ---------------------------------------------------------------------------
mod_id=snowempress
mod_name=Snow Empress
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.snowempress
mod_authors=you
mod_description=A Twilight Forest addon: turns the Snow Queen into a friendly companion with new abilities and a rewritten AI.
