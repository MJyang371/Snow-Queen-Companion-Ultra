modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# ---------------------------------------------------------------------------
# Hard requirement: The Twilight Forest must be present for this addon to work.
# 4.3.2508 is the jar in the test instance; the range keeps 4.3.x compatible.
# ---------------------------------------------------------------------------
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="twilightforest"
    mandatory=true
    versionRange="[4.3.2508,4.4)"
    ordering="AFTER"
    side="BOTH"
